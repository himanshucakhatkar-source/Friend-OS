<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initialize Profile</title><link rel="stylesheet" href="css/system.css"></head><body class="auth-page"><main class="auth-card wide"><p class="eyebrow">SYSTEM INITIALIZATION</p><h1>Initialize Player Profile</h1><form id="profile-form" class="two-col"><label>Display name<input required name="display_name" maxlength="60"></label><label>Username<input required name="username" pattern="[a-zA-Z0-9_]{3,30}" title="3-30 letters, numbers, underscores"></label><label>Codename<input name="codename" maxlength="60"></label><label>Optional subject<input name="optional_subject" maxlength="100"></label><label>Favourite GS subject<input name="favourite_gs_subject" maxlength="100"></label><label>UPSC status<select name="aspirant_status"><option value="aspirant">Aspirant</option><option value="exploring">Exploring</option><option value="other">Other</option></select></label><label class="full">Bio<textarea name="bio" maxlength="500"></textarea></label><label class="full">Personal quote<input name="quote" maxlength="180"></label><label class="full">Avatar <input type="file" name="avatar" accept="image/png,image/jpeg,image/webp"></label><button class="button primary full">Complete Initialization</button></form><p id="form-message" class="message"></p></main><script type="module" src="js/profile.js"></script></body></html>
